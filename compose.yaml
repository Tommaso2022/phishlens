# PhishLens: ambiente di sviluppo.
#
# Reti (docs/threat-model.md, sezione 5):
#   data            Postgres e Redis. Interna: nessun accesso a Internet.
#   fetch           Worker -> fetcher. Interna.
#   edge            Backend: porta pubblicata solo su 127.0.0.1; uscita verso HIBP (F12).
#   egress-worker   Worker -> API esterne (F9).
#   egress-fetcher  Fetcher -> siti analizzati (F8). Il fetcher NON è sulla rete "data".
#   test            Solo il database dei test (profilo "test"), pubblicato su 127.0.0.1:55432.
#
# Database (docs/threat-model.md, riga T-03): tre utenti con privilegi diversi.
#   phishlens        amministratore; non usato dall'applicazione
#   phishlens_owner  proprietario dello schema: lo usa solo il servizio "migrate"
#   phishlens_app    backend e worker: legge e scrive dati, non modifica le tabelle
#
# Le porte pubblicate sono sempre legate a 127.0.0.1: altrimenti sarebbero
# raggiungibili da chiunque sulla stessa rete Wi-Fi (threat model, I-04).

name: phishlens

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  environment:
    PHISHLENS_ENV: development

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: phishlens
      POSTGRES_USER: phishlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD nel file .env}
      PHISHLENS_OWNER_DB_PASSWORD: ${PHISHLENS_OWNER_DB_PASSWORD:?manca PHISHLENS_OWNER_DB_PASSWORD nel file .env}
      PHISHLENS_APP_DB_PASSWORD: ${PHISHLENS_APP_DB_PASSWORD:?manca PHISHLENS_APP_DB_PASSWORD nel file .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    networks: [data]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishlens -d phishlens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?manca REDIS_PASSWORD nel file .env}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks: [data]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *hardened
    image: phishlens/backend:dev
    build:
      context: .
      args:
        SERVICE: backend
    command: ["python", "-m", "phishlens_db.migrate"]
    restart: "no"
    environment:
      PHISHLENS_ENV: development
      PHISHLENS_MIGRATION_DATABASE_URL: postgresql+psycopg://phishlens_owner:${PHISHLENS_OWNER_DB_PASSWORD}@db:5432/phishlens
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *hardened
    image: phishlens/backend:dev
    build:
      context: .
      args:
        SERVICE: backend
    command: ["uvicorn", "--factory", "phishlens_backend.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PHISHLENS_ENV: development
      PHISHLENS_DATABASE_URL: postgresql+psycopg://phishlens_app:${PHISHLENS_APP_DB_PASSWORD}@db:5432/phishlens
      PHISHLENS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PHISHLENS_BASE_URL: http://127.0.0.1:8000
      PHISHLENS_SMTP_HOST: mailpit
      PHISHLENS_SMTP_PORT: "1025"
      PHISHLENS_TOTP_KEY: ${PHISHLENS_TOTP_KEY:?manca PHISHLENS_TOTP_KEY nel file .env}
      # Solo sviluppo: su http://127.0.0.1 un cookie Secure non verrebbe rimandato.
      # In produzione (HTTPS) resta true e il cookie usa il prefisso __Host-.
      PHISHLENS_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8000:8000"
    networks: [data, edge]
    depends_on:
      mailpit:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *hardened
    image: phishlens/worker:dev
    build:
      context: .
      args:
        SERVICE: worker
    command: ["python", "-m", "phishlens_worker.main"]
    environment:
      PHISHLENS_ENV: development
      PHISHLENS_DATABASE_URL: postgresql+psycopg://phishlens_app:${PHISHLENS_APP_DB_PASSWORD}@db:5432/phishlens
    networks: [data, fetch, egress-worker]
    depends_on:
      redis:
        condition: service_healthy

  fetcher:
    <<: *hardened
    image: phishlens/fetcher:dev
    build:
      context: .
      args:
        SERVICE: fetcher
    command: ["uvicorn", "phishlens_fetcher.main:app", "--host", "0.0.0.0", "--port", "8001"]
    networks: [fetch, egress-fetcher]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  mailpit:
    # Solo sviluppo: riceve le email inviate dal backend e le mostra su
    # http://127.0.0.1:8025 senza inoltrarle a nessuno. Non esiste in produzione.
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:8025:8025"
    networks: [data, edge]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  db-test:
    image: postgres:17-alpine
    profiles: ["test"]
    # cluster_name dichiara l'istanza come "di test": i fixture si rifiutano di
    # creare ruoli e database su qualsiasi altra istanza (db/tests/conftest.py).
    command: ["postgres", "-c", "cluster_name=phishlens-test"]
    environment:
      POSTGRES_DB: phishlens
      POSTGRES_USER: phishlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manca POSTGRES_PASSWORD nel file .env}
      PHISHLENS_OWNER_DB_PASSWORD: ${PHISHLENS_OWNER_DB_PASSWORD:?manca PHISHLENS_OWNER_DB_PASSWORD}
      PHISHLENS_APP_DB_PASSWORD: ${PHISHLENS_APP_DB_PASSWORD:?manca PHISHLENS_APP_DB_PASSWORD}
    volumes:
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data  # dati in memoria: spariscono a ogni riavvio
    ports:
      - "127.0.0.1:55432:5432"
    networks: [test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishlens -d phishlens"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  data:
    internal: true
  fetch:
    internal: true
  edge: {}
  egress-worker: {}
  egress-fetcher: {}
  test: {}

volumes:
  db-data: {}
  redis-data: {}
