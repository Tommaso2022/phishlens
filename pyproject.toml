[project]
name = "phishlens"
version = "0.1.0"
description = "Analizzatore di phishing con ML spiegabile"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "core",
    "backend",
    "worker",
    "fetcher",
    "ml",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
