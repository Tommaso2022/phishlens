[project]
name = "phishlens-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.157.0",
    "httpx>=0.28.1",
    "phishlens-core",
    "phishlens-db",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
phishlens-core = { workspace = true }
phishlens-db = { workspace = true }
